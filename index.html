<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minefield — LaunchTower</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #2d3748;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 24px;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
    color: var(--text);
  }
  h1 .mine { color: var(--red); }
  .sub {
    color: var(--dim);
    font-size: 12px;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  .sizebar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .sizebar button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: inherit;
    font-size: 12px;
    padding: 7px 14px;
    cursor: pointer;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .sizebar button:hover { color: var(--text); border-color: var(--accent); }
  .sizebar button.active {
    background: var(--panel2);
    color: var(--accent);
    border-color: var(--accent);
  }
  #board {
    display: grid;
    gap: 3px;
    background: var(--panel);
    border: 2px solid var(--border);
    padding: 8px;
    border-radius: 6px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .cell {
    width: 30px;
    height: 30px;
    background: var(--panel2);
    border: 1px solid #39445a;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    position: relative;
    transition: background 0.05s;
  }
  .cell:hover { background: #232d40; }
  .cell.revealed {
    background: #0a0e14;
    border-color: #1f2734;
    cursor: default;
  }
  .cell.mine {
    background: #3d1a1a;
    border-color: var(--red);
  }
  .cell.boom {
    background: var(--red);
    border-color: #ff8a80;
  }
  .cell.flagged { background: #2a2410; }
  .n1 { color: #58a6ff; } .n2 { color: #3fb950; } .n3 { color: #f85149; }
  .n4 { color: #bc8cff; } .n5 { color: #d29922; } .n6 { color: #39c5cf; }
  .n7 { color: #f0f6fc; } .n8 { color: #ff7b72; }
  .hud {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    min-width: 74px;
    text-align: center;
  }
  .stat .lbl { color: var(--dim); font-size: 10px; letter-spacing: 1px; display: block; }
  .stat .val { font-size: 15px; }
  .stat.best .val { color: var(--green); }
  #restart {
    background: var(--panel2);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  #restart:hover { background: var(--accent); color: #0d1117; }
  .msg {
    margin-top: 10px;
    font-size: 13px;
    min-height: 18px;
    letter-spacing: 1px;
  }
  .msg.win { color: var(--green); }
  .msg.lose { color: var(--red); }
  .help {
    color: var(--dim);
    font-size: 11px;
    margin-top: 14px;
    text-align: center;
    line-height: 1.6;
    max-width: 420px;
  }
  footer {
    margin-top: 22px;
    font-size: 11px;
    color: var(--dim);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  @media (max-width: 480px) {
    .cell { width: 26px; height: 26px; font-size: 13px; }
    #board { gap: 2px; padding: 6px; }
    h1 { font-size: 18px; }
  }
</style>
</head>
<body>
  <h1><span class="mine">&#9679;</span> MINEFIELD</h1>
  <div class="sub">LaunchTower &middot; a pixel minesweeper</div>

  <div class="sizebar" id="sizebar">
    <button data-size="0">EASY 8&times;8</button>
    <button data-size="1" class="active">MED 12&times;12</button>
    <button data-size="2">HARD 16&times;16</button>
  </div>

  <div id="board"></div>

  <div class="hud">
    <div class="stat"><span class="lbl">MINES</span><span class="val" id="mineCount">0</span></div>
    <div class="stat"><span class="lbl">FLAGS</span><span class="val" id="flagCount">0</span></div>
    <div class="stat"><span class="lbl">TIME</span><span class="val" id="time">0s</span></div>
    <div class="stat best"><span class="lbl">BEST</span><span class="val" id="best">&mdash;</span></div>
    <button id="restart">RESTART</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="help">
    Left-click / tap to reveal &middot; Right-click / long-press to flag<br>
    Your first click is always safe. Beat your best time.
  </div>

  <footer>
    &copy; LaunchTower &middot;
    <a href="https://pennypenguinapp-beep.github.io/">more tools &amp; games &rarr;</a>
  </footer>

<script>
(function () {
  'use strict';

  var SIZES = [
    { rows: 8,  cols: 8,  mines: 10 },
    { rows: 12, cols: 12, mines: 24 },
    { rows: 16, cols: 16, mines: 45 }
  ];

  var boardEl = document.getElementById('board');
  var msgEl = document.getElementById('msg');
  var timeEl = document.getElementById('time');
  var mineEl = document.getElementById('mineCount');
  var flagEl = document.getElementById('flagCount');
  var bestEl = document.getElementById('best');
  var sizebar = document.getElementById('sizebar');

  var sizeIdx = 1;
  var grid = [];          // {mine, revealed, flagged, adj}
  var started = false;
  var gameOver = false;
  var flagsPlaced = 0;
  var revealedCount = 0;
  var timer = null;
  var seconds = 0;

  function bestKey() { return 'launchtower_minefield_best_' + sizeIdx; }

  function getBest() {
    try { return localStorage.getItem(bestKey()); } catch (e) { return null; }
  }
  function setBest(s) {
    try { localStorage.setItem(bestKey(), String(s)); } catch (e) {}
  }
  function refreshBest() {
    var b = getBest();
    bestEl.innerHTML = (b === null) ? '&mdash;' : (b + 's');
  }

  function startTimer() {
    stopTimer();
    seconds = 0;
    timeEl.textContent = '0s';
    timer = setInterval(function () {
      seconds++;
      timeEl.textContent = seconds + 's';
    }, 1000);
  }
  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function newGame() {
    var s = SIZES[sizeIdx];
    grid = [];
    for (var r = 0; r < s.rows; r++) {
      var row = [];
      for (var c = 0; c < s.cols; c++) {
        row.push({ mine: false, revealed: false, flagged: false, adj: 0 });
      }
      grid.push(row);
    }
    started = false;
    gameOver = false;
    flagsPlaced = 0;
    revealedCount = 0;
    stopTimer();
    seconds = 0;
    timeEl.textContent = '0s';
    mineEl.textContent = s.mines;
    flagEl.textContent = '0 / ' + s.mines;
    msgEl.textContent = '';
    msgEl.className = 'msg';
    refreshBest();
    render();
  }

  function placeMines(safeR, safeC) {
    var s = SIZES[sizeIdx];
    var safe = {};
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        var rr = safeR + dr, cc = safeC + dc;
        if (rr >= 0 && rr < s.rows && cc >= 0 && cc < s.cols) safe[rr + ',' + cc] = true;
      }
    }
    var candidates = [];
    for (var r = 0; r < s.rows; r++)
      for (var c = 0; c < s.cols; c++)
        if (!safe[r + ',' + c]) candidates.push([r, c]);
    // shuffle
    for (var i = candidates.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = candidates[i]; candidates[i] = candidates[j]; candidates[j] = t;
    }
    for (var k = 0; k < s.mines; k++) {
      grid[candidates[k][0]][candidates[k][1]].mine = true;
    }
    // compute adjacency
    for (var r2 = 0; r2 < s.rows; r2++) {
      for (var c2 = 0; c2 < s.cols; c2++) {
        if (grid[r2][c2].mine) continue;
        var n = 0;
        for (var dr2 = -1; dr2 <= 1; dr2++) {
          for (var dc2 = -1; dc2 <= 1; dc2++) {
            if (dr2 === 0 && dc2 === 0) continue;
            var rr2 = r2 + dr2, cc2 = c2 + dc2;
            if (rr2 >= 0 && rr2 < s.rows && cc2 >= 0 && cc2 < s.cols && grid[rr2][cc2].mine) n++;
          }
        }
        grid[r2][c2].adj = n;
      }
    }
  }

  function neighbors(r, c) {
    var s = SIZES[sizeIdx];
    var out = [];
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        var rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < s.rows && cc >= 0 && cc < s.cols) out.push([rr, cc]);
      }
    }
    return out;
  }

  function reveal(r, c) {
    var cell = grid[r][c];
    if (cell.revealed || cell.flagged) return;
    if (!started) {
      placeMines(r, c);
      started = true;
      startTimer();
    }
    if (cell.mine) { lose(r, c); return; }
    // flood fill
    var stack = [[r, c]];
    while (stack.length) {
      var p = stack.pop();
      var cur = grid[p[0]][p[1]];
      if (cur.revealed || cur.flagged || cur.mine) continue;
      cur.revealed = true;
      revealedCount++;
      if (cur.adj === 0) {
        var ns = neighbors(p[0], p[1]);
        for (var i = 0; i < ns.length; i++) stack.push(ns[i]);
      }
    }
    checkWin();
    render();
  }

  function toggleFlag(r, c) {
    if (gameOver) return;
    var cell = grid[r][c];
    if (cell.revealed) return;
    cell.flagged = !cell.flagged;
    flagsPlaced += cell.flagged ? 1 : -1;
    flagEl.textContent = flagsPlaced + ' / ' + SIZES[sizeIdx].mines;
    render();
  }

  function lose(hitR, hitC) {
    gameOver = true;
    stopTimer();
    for (var r = 0; r < grid.length; r++) {
      for (var c = 0; c < grid[0].length; c++) {
        var cell = grid[r][c];
        if (cell.mine) cell.revealed = true;
      }
    }
    grid[hitR][hitC].boom = true;
    msgEl.textContent = 'BOOM! ' + seconds + 's — hit RESTART';
    msgEl.className = 'msg lose';
    render();
  }

  function checkWin() {
    var s = SIZES[sizeIdx];
    if (revealedCount === s.rows * s.cols - s.mines) {
      gameOver = true;
      stopTimer();
      msgEl.textContent = 'CLEARED IN ' + seconds + 's!';
      msgEl.className = 'msg win';
      var prev = getBest();
      if (prev === null || seconds < parseInt(prev, 10)) {
        setBest(seconds);
        msgEl.textContent = 'NEW BEST: ' + seconds + 's!';
      }
      refreshBest();
    }
  }

  function render() {
    var s = SIZES[sizeIdx];
    boardEl.style.gridTemplateColumns = 'repeat(' + s.cols + ', auto)';
    boardEl.innerHTML = '';
    for (var r = 0; r < s.rows; r++) {
      for (var c = 0; c < s.cols; c++) {
        var cell = grid[r][c];
        var el = document.createElement('div');
        el.className = 'cell';
        el.dataset.r = r;
        el.dataset.c = c;
        if (cell.flagged) {
          el.classList.add('flagged');
          el.textContent = '\u2691';
        } else if (cell.revealed) {
          el.classList.add('revealed');
          if (cell.mine) {
            el.classList.add('mine');
            el.textContent = '\u25CF';
            if (cell.boom) el.classList.add('boom');
          } else if (cell.adj > 0) {
            el.classList.add('n' + cell.adj);
            el.textContent = cell.adj;
          }
        }
        boardEl.appendChild(el);
      }
    }
  }

  // --- input: click / right-click / long-press ---
  var pressTimer = null;
  var pressPos = null;
  var longFired = false;

  boardEl.addEventListener('contextmenu', function (e) {
    e.preventDefault();
  });

  boardEl.addEventListener('mousedown', function (e) {
    var cellEl = e.target.closest('.cell');
    if (!cellEl) return;
    if (e.button === 2) {
      toggleFlag(+cellEl.dataset.r, +cellEl.dataset.c);
      return;
    }
    if (e.button === 0) {
      longFired = false;
      pressPos = { x: e.clientX, y: e.clientY, r: +cellEl.dataset.r, c: +cellEl.dataset.c };
      pressTimer = setTimeout(function () {
        longFired = true;
        toggleFlag(pressPos.r, pressPos.c);
      }, 450);
    }
  });

  boardEl.addEventListener('mouseup', function (e) {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (e.button !== 0 || longFired) return;
    var cellEl = e.target.closest('.cell');
    if (!cellEl) return;
    reveal(+cellEl.dataset.r, +cellEl.dataset.c);
  });

  boardEl.addEventListener('mouseleave', function () {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  });

  // touch: tap = reveal, long-press = flag
  boardEl.addEventListener('touchstart', function (e) {
    var cellEl = e.target.closest('.cell');
    if (!cellEl) return;
    longFired = false;
    pressPos = { r: +cellEl.dataset.r, c: +cellEl.dataset.c };
    pressTimer = setTimeout(function () {
      longFired = true;
      toggleFlag(pressPos.r, pressPos.c);
    }, 450);
  }, { passive: true });

  boardEl.addEventListener('touchend', function (e) {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (longFired) return;
    var cellEl = e.target.closest('.cell');
    if (!cellEl) return;
    reveal(+cellEl.dataset.r, +cellEl.dataset.c);
  }, { passive: true });

  boardEl.addEventListener('touchcancel', function () {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  });

  sizebar.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    sizeIdx = +btn.dataset.size;
    var btns = sizebar.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    btn.classList.add('active');
    newGame();
  });

  document.getElementById('restart').addEventListener('click', newGame);

  newGame();
})();
</script>
</body>
</html>
